[workspace]
resolver = "2"
members = [
    "crates/pbps-model",
    "crates/pbps-config",
    "crates/pbps-load",
    "crates/pbps-diff",
    "crates/pbps-dialect",
    "crates/pbps-mssql",
    "crates/pbps-pg",
    "crates/pbps-docs",
    "crates/pbps-db",
    "crates/pbps-policy",
    "crates/pbps-cli",
]

# spike: the Phase 0 YAML crate evaluation; removed once the choice is settled
exclude = ["spikes/yaml-span"]


[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"   # required by serde-saphyr, see docs/ADR-0001
license = "Apache-2.0"
repository = "https://github.com/pongbiphang/pbps"
authors = ["PongBiphang"]

[workspace.dependencies]
pbps-model   = { path = "crates/pbps-model" }
pbps-config  = { path = "crates/pbps-config" }
pbps-load    = { path = "crates/pbps-load" }
pbps-diff    = { path = "crates/pbps-diff" }
pbps-dialect = { path = "crates/pbps-dialect" }
pbps-mssql   = { path = "crates/pbps-mssql" }
pbps-pg      = { path = "crates/pbps-pg" }
pbps-docs    = { path = "crates/pbps-docs" }
pbps-db      = { path = "crates/pbps-db" }
pbps-policy  = { path = "crates/pbps-policy" }

serde      = { version = "1", features = ["derive"] }

# The driver is pure Rust: no ODBC to install, which matters on air-gapped
# hosts (SPEC §11.3). tokio is pulled for the driver, not embraced: only
# pbps-db and the mssql introspection are async, and the CLI block_on's them.
#
# `tiberius-ng` is a waypoint, not the destination (SPEC open question 10).
# The original crate is community-maintained again at tiberius-rs/tiberius, but
# as of 2026-09-04 has no release past 0.12.3, which pins `tokio-rustls 0.24`
# and with it four open rustls advisories. Switch `package` back to `tiberius`
# only for a release whose `rustls` feature resolves `rustls >= 0.23`, and run
# `cargo deny check` and the live suite before keeping it.
tiberius   = { package = "tiberius-ng", version = "0.13", default-features = false, features = ["rustls", "tds73"] }
# `time` is for the connect timeout: a firewall that drops rather than
# refuses would otherwise leave a pipeline waiting out the OS retry.
tokio      = { version = "1", features = ["net", "rt", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

# PostgreSQL (Phase 5, ADR-0007 decision 5 / ADR-0014). Pure Rust like the SQL
# Server driver, so §11.3's single static binary still needs nothing installed
# on the host. TLS is the caller's choice here rather than pinned by the driver
# — the property ADR-0014's Limits names `tiberius 0.12` as lacking — so it is
# made explicitly, against the one `rustls` already in this tree.
tokio-postgres = { version = "0.7", default-features = false }
# `aws-lc-rs`, not `ring`, and the reason is measured rather than preferred:
# `tiberius-ng` resolves `rustls` with its default provider, so asking for
# `ring` here compiled **both** into the binary. rustls then cannot determine a
# process-level provider and panics the moment a `ClientConfig::builder()` runs
# — which the PostgreSQL live suite hit on its first connection, and which no
# amount of building or `cargo deny` could have shown. One provider in the tree
# is the shape that cannot fail that way (DECISIONS 228).
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
# `tokio-postgres`'s own `connect_socket` applies `keepalives`,
# `keepalives_idle/_interval/_retries` and `tcp_user_timeout` through
# `socket2::SockRef` and shuffles `load_balance_hosts=random` through `rand` —
# `pbps-db` opens the socket itself instead (ADR-0014 §3), so it needs the same
# two crates directly to reach parity (issue #113). Neither is new to the
# tree: `socket2` is already resolved through `tokio`'s own `net` feature and
# `rand` through `tokio-postgres`'s `postgres-protocol`, both at the version
# named here, so this adds a direct edge to an already-audited node rather
# than a new one (DECISIONS 429).
socket2    = { version = "0.6", features = ["all"] }
rand       = "0.10"

serde_json = { version = "1", features = ["preserve_order"] }

# Plan pinning (SPEC §7.3) needs a checksum an auditor recognizes. Pure Rust,
# no C dependency, so the single static binary of §11.4 stays single.
sha2       = "0.10"

thiserror  = "2"
# Naming rules in the `policies:` block take a regular expression
# (ADR-0008). `regex-lite`: pure Rust, no unsafe, and a small fraction of
# `regex`'s tree for the anchored patterns a naming rule is.
regex-lite = "0.1"
anyhow     = "1"
miette     = "7"
# `string`: the man-page generator renames each subcommand to `pbps-<name>` at
# runtime, and without it clap only accepts a `&'static str` there.
clap       = { version = "4", features = ["derive", "string"] }
# Completions and man pages are generated from the same command tree clap
# already holds, so there is no second description of the CLI to keep in step.
clap_complete = "4"
clap_mangen   = "0.2"
indexmap   = { version = "2", features = ["serde"] }

# YAML: see docs/ADR-0001-yaml-crate.md. Only pbps-load may depend on it
# directly; every other crate goes through pbps-load, which keeps a future
# replacement a bounded piece of work.
serde-saphyr = "1.2"

# JSON Schema for the editor integration of SPEC 14.1, generated from the
# loader's and the config's own types so the two cannot drift. `indexmap2`
# because column order is meaningful and `TableDto::columns` is an IndexMap.
schemars = { version = "1", features = ["indexmap2"] }

# Tests only, and only for the envelope schema of SPEC 9.8: the published
# schema is checked by validating real command output against it, and the
# alternative — a validator written inside the test — would be a second
# implementation of the very thing under test. `default-features = false`
# keeps the network resolver and its TLS stack out; nothing here fetches a
# remote `$ref`. It never reaches the shipped binary (SPEC 11.4).
jsonschema = { version = "0.54", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The correctness of diff and emit depends on exhaustive matching; a catch-all
# `_ =>` must not paper over a missing case.
wildcard_enum_match_arm = "warn"
