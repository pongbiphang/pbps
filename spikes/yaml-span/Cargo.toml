[package]
name = "yaml-span-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Phase 0 spike: evaluating the span and diagnostic capabilities of candidate
# YAML crates. The whole spikes/yaml-span directory goes once the choice is made.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.2"
marked-yaml = { version = "0.8", features = ["serde"] }
