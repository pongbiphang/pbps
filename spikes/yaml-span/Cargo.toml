[package]
name = "yaml-span-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Phase 0 spike: evaluating the span and diagnostic capabilities of candidate
# YAML crates. Retained outside the production workspace as the original
# decision evidence (DECISIONS 437; ../README.md).

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.2"
marked-yaml = { version = "0.8", features = ["serde"] }
