[package]
name = "pg-driver-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Phase 5 spike: does the `pbps-db` seam — `Conn`, `Row`, `FromColumn`, `Param`
# — absorb a second driver? ADR-0007 decision 5 claims it does, and no second
# driver has ever been put through it. This crate re-implements that seam's
# public shape over `tokio-postgres` and runs the SPEC 11.5 all-or-nothing
# invariant against a live server. Retained as historical evidence, outside
# the production workspace (DECISIONS 437; ../README.md).

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = "0.7"
thiserror = "2"

# Keep the experiment independently runnable. The production workspace also
# explicitly excludes it so both manifests state the same boundary (DECISIONS 437).
[workspace]
