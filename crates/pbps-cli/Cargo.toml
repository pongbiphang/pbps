[package]
name = "pbps-cli"
description = "PongBiphang Schema - declarative database schema version control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pbps"
path = "src/main.rs"

[dependencies]
pbps-model.workspace = true
pbps-config.workspace = true
pbps-load.workspace = true
pbps-diff.workspace = true
pbps-dialect.workspace = true
pbps-mssql.workspace = true
pbps-db.workspace = true
pbps-policy.workspace = true
pbps-docs.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
anyhow.workspace = true
thiserror.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
pbps-load.workspace = true
# The plan-file fixtures carry a version, and a fixture that pins it by hand
# goes stale the moment the format moves; the constant is the tool's own.
pbps-model.workspace = true
# For the live tests only: the ledger state a CLI flag cannot produce — a lock
# taken while the ledger is still empty — is set up with the same functions the
# tool uses, rather than by a copy of the DDL in the test.
pbps-db.workspace = true
pbps-mssql.workspace = true
tokio.workspace = true
