[package]
name = "pbps-sqlite"
description = "PongBiphang Schema - the SQLite dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The connection is `pbps_db::sqlite`: the library stays behind the transport
# crate, and this crate names no driver type (ARCHITECTURE constraint 9).
pbps-db.workspace = true
# `TransactionFraming`: the text of begin, commit and rollback is the
# dialect's (ADR-0014 section 2).
pbps-dialect.workspace = true
# `ColumnType`, which the type table reads and writes.
pbps-model.workspace = true
# The sealed plan type `PlanDialect::Plan` names: an emitter takes a plan only
# through `pbps_diff::order::PlanView`.
pbps-diff.workspace = true

[dev-dependencies]
# A one-operation plan and the differ's own route, for the emitter's tests.
pbps-diff = { workspace = true, features = ["test-fixtures"] }
# The harness names each test's directory with a random suffix, as the CLI's
# own tests do.
rand.workspace = true

[lints]
workspace = true
