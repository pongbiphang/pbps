[package]
name = "pbps-ui"
description = "Local read views over the pbps CLI envelope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
# Compose needs the no-follow directory walk, the atomic exchange, the
# metadata copy and the process-group kill of ADR-0015 decision 5, and the
# workspace forbids `unsafe`, so the calls come through safe wrappers rather
# than `libc`. `rustix` is already in this tree for the resolver's socket
# diagnostics, at this version: a direct edge to an audited node, not a new
# one (DECISIONS 434 is the same move).
rustix = { workspace = true, features = ["fs", "process", "rand"] }

[lints]
workspace = true
