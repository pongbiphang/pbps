[package]
name = "pbps-mssql"
description = "PongBiphang Schema - the Microsoft SQL Server dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pbps-diff.workspace = true
pbps-model.workspace = true
pbps-dialect.workspace = true
pbps-db.workspace = true
# The authorization context is serialised into its canonical form for the
# fingerprint (#611), the same way the PostgreSQL one is.
serde.workspace = true
# Scratch comparisons keep numeric JSON tokens without rounding future columns.
serde_json = { workspace = true, features = ["raw_value"] }
# The generated default-constraint name is cut to fit and carries a digest of
# the qualified column so two cuts stay distinct. The same checksum the plan
# pinning already uses, rather than a second hash in the tree.
sha2.workspace = true
thiserror.workspace = true
tiberius.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
pbps-diff = { workspace = true, features = ["test-fixtures"] }
# The commutation suite (#1965) declares its scenarios in YAML and loads them
# the way `plan` loads a schema directory.
pbps-load.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
