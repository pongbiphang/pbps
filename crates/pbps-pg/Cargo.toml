[package]
name = "pbps-pg"
description = "PongBiphang Schema - the PostgreSQL dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Scratch settles the same typed creation parts as deployment (#1503).
pbps-diff.workspace = true
pbps-model.workspace = true
pbps-dialect.workspace = true
# Connected engine operations use the shared connection seam; driver types
# remain private in pbps-db.
pbps-db.workspace = true
# The assertion deadline includes connection setup and transaction postchecks.
tokio.workspace = true
# The ledger writes one snapshot per row as JSON (Phase 5 step 8); the shape is
# `pbps_model::StateSnapshot`'s, and this is what serializes it.
serde.workspace = true
serde_json.workspace = true
# Private versioned resolver input verifiers; never an ordinary report.
sha2.workspace = true
# `rows::RowsError`, which travels beside a `DbError` and a `DialectError` and
# has to carry both (Phase 5 step 7).
thiserror.workspace = true
# Carets follow terminal width after inert escaping, not UTF-8 bytes.
unicode-width = "0.2.2"

# The opaque native transfer opens only beneath a caller-held root. It does
# not discover processes, acquire a runtime, or own lifecycle qualification.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
pbps-diff = { workspace = true, features = ["test-fixtures"] }
pbps-mssql.workspace = true
# The commutation suite (#1965) declares its scenarios in YAML and loads them
# the way `plan` loads a schema directory.
pbps-load.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }

[lints]
workspace = true
