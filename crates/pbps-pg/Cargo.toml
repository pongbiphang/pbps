[package]
name = "pbps-pg"
description = "PongBiphang Schema - the PostgreSQL dialect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pbps-model.workspace = true
pbps-dialect.workspace = true
# Promoted from a dev-dependency by introspection (Phase 5 step 3): `catalog`
# holds a connection, and it is the only file in this crate that does.
pbps-db.workspace = true

[dev-dependencies]
# The live suite plans a migration the way `plan --db` does, so that what it
# applies is a real `ChangeSet` and not a hand-built list of changes.
pbps-diff.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }

[lints]
workspace = true
