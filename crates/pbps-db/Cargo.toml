[package]
name = "pbps-db"
description = "PongBiphang Schema - database connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enabled by the CLI's dev-dependency only; production has no counter hooks.
test-request-count = []

[dependencies]
pbps-model.workspace = true
# For `TransactionFraming` only: the text of begin/commit/rollback is the
# dialect's, so this crate holds no engine SQL (ADR-0014 §2).
pbps-dialect.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
# One driver per module, named nowhere else in the workspace: `tiberius` in
# `mssql`, `tokio-postgres` in `postgres` (ADR-0007 decision 5, DECISIONS 225).
tiberius.workspace = true
# Inspect the same effective ADO.NET keys as the driver before its handshake.
connection-string.workspace = true
tokio-util.workspace = true
tokio-postgres.workspace = true
# TLS for the PostgreSQL driver, chosen here because `tokio-postgres` leaves it
# to the caller — the property ADR-0014's Limits name `tiberius 0.12` as
# lacking. The same `rustls` the other driver already resolves.
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# Socket-tuning parity with `tokio-postgres`'s own `connect_socket` (issue
# #113): `SockRef` from `socket2` sets keepalive and `tcp_user_timeout`, and
# `rand` shuffles the resolved address list for `load_balance_hosts=random`.
socket2.workspace = true
rand.workspace = true
# Keyed fingerprints (DEC-952.1): the key is read as base64 and mixed in with
# HMAC-SHA256.
base64.workspace = true
hmac.workspace = true
sha2-hmac.workspace = true

# The socket opener's tests need a runtime: they build a black hole out of a
# listening socket and time the attempts against it.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# Windows current-user integrated authentication (SSPI), for the named-pipe
# transport LocalDB requires (#2271). Windows only: elsewhere the feature has
# no backend, and the driver would read `Integrated Security` as SQL
# authentication, so `mssql.rs` refuses it by name instead. The TLS features
# stay the workspace's explicit set.
[target.'cfg(windows)'.dependencies]
tiberius = { workspace = true, features = ["winauth"] }

[lints]
workspace = true
