name: CI

on:
  push:
    # `master` is the current default branch. Keep `main` subscribed as well so
    # a future branch rename cannot silently remove post-merge coverage.
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Development happens on Linux, so Windows coverage rests entirely on this
  # matrix: line endings, path separators and terminal detection are the kinds of
  # platform difference that only show up here.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  # The SPEC 11.5 invariants against a real SQL Server (bootstrap == introspect,
  # apply(plan(A->B)) converges on B). Linux only: the service container needs a
  # Linux docker host.
  live:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Pbps!Ci12345"
        ports:
          - 14330:1433
    env:
      PBPS_TEST_DB: "Server=localhost,14330;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The service has no health check hook here; the loop stands in for one.
      - name: wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker exec $(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2025-latest)                 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Pbps!Ci12345" -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server never became ready" >&2; exit 1
      - run: cargo test -p pbps-mssql --test live -- --ignored
      # Phase 3.1's onboarding path and the optional dev rehearsal both cross
      # the CLI/database boundary, so the dialect-only suite cannot exercise
      # them. Keep these ignored in ordinary jobs and run them here against the
      # same real engine.
      - run: cargo test -p pbps-cli --test flow -- --ignored

  # The MSRV is set by serde-saphyr (see docs/ADR-0001). It gets its own job so
  # that accidentally using newer syntax is caught here rather than by a user.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
