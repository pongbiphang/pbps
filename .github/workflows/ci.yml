name: CI

# An ordinary workflow: every pull request, and `master`. It was not always.
# While the repository was private, the full matrix on every commit of a review
# round cost more minutes than the allowance carried, so CI was started by hand
# and reported itself as a *commit status* — a `workflow_dispatch` check suite
# belongs to no pull request, so its check runs were green in the Actions tab
# and invisible in the PR (DECISIONS 206). Standard runners bill nothing on a
# public repository, so the reason is gone, and with it the workaround: `gate`
# below is an ordinary job whose check run reaches the pull request the
# ordinary way (DECISIONS 501).
#
# `merge_group` fires nothing until a merge queue is required on `master`
# (issue #636). It is declared now so that enabling one is a change to the
# ruleset alone: a queue whose required checks do not run on the merge group
# never advances.
#
# `workflow_dispatch` is kept for running the matrix on a branch that has no
# pull request. It cannot retry a pull request's CI: a dispatched check suite
# belongs to no pull request, so its `ci-gate` never reaches the merge box —
# the failure DECISIONS 206 describes, reached by a different route. A pull
# request's run is retried with `gh run rerun <run-id>`, which keeps the
# association because it is the same run.
#
# Do not add `paths` or `paths-ignore` here. `ci-gate` is a required check, and
# a required check that never reports leaves a pull request blocked with
# nothing that can clear it.
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

# Named here so the grant is one line rather than the repository-wide default:
# no job writes anything, `gate` included — it reports by failing, not by
# calling the API.
permissions:
  contents: read

# Keyed on the pull request number where there is one, so that a run on
# `refs/pull/N/merge` and a later run on the branch do not share a group.
# Only pull-request runs are cancelled: a `push` or `merge_group` run is the
# only run its commit will ever get, and cancelling it reports `cancelled`
# where the gate expects an answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Keep the short checks in one job: one toolchain and one cache restore
  # rather than three. Every other job waits on this one, so nothing expensive
  # starts for a commit that does not even compile — a fan-in the engine-backed
  # jobs below want for their own sake, not only for the minutes it once saved.
  quick:
    name: test and lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before the toolchain: it needs none, and a duplicate decision
      # identifier from two branches merges without a textual conflict, so this
      # is the only place it is caught (DEC-671.1).
      - run: python3 scripts/check_decisions_test.py
      - run: python3 scripts/check-decisions.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --all-targets

  # Development happens on Linux, so Windows coverage rests entirely on this
  # job: line endings, path separators and terminal detection are the kinds of
  # platform difference that only show up here.
  windows:
    name: test (windows-latest)
    needs: quick
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # The SPEC 11.5 invariants against a real SQL Server (bootstrap == introspect,
  # apply(plan(A->B)) converges on B). Linux only: the service container needs a
  # Linux docker host.
  live:
    needs: quick
    runs-on: ubuntu-latest
    services:
      mssql:
        # Pinned by digest: SQL Server 2025 RTM, 17.0.4075.5, image built
        # 2026-07-23. `2025-latest` is a floating tag, so the engine under test
        # could change between two runs of the same commit — which is the one
        # thing a suite that exists to answer "what does the engine actually do"
        # cannot afford. Bump deliberately, and run `scripts/live-tests.sh`
        # against the new digest before pushing the bump.
        #
        # This is **not** a fix for the startup crashes recorded in
        # docs/PITFALLS.md; their cause is unproven and looks resource-shaped
        # (errno 11 on a 2-CPU runner). What it buys is that the next one is
        # reproducible instead of unrepeatable.
        image: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Pbps!Ci12345"
        ports:
          - 14330:1433
    env:
      PBPS_TEST_DB: "Server=localhost,14330;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The service has no health check hook here; the loop stands in for one.
      #
      # Found by the published port, not by `ancestor=<image>`: that filter
      # repeated the image reference, so pinning it above would have left the
      # two spellings free to drift apart and this step looking for a container
      # that no longer matches.
      - name: wait for SQL Server
        run: |
          id=$(docker ps -q --filter publish=14330)
          if [ -z "$id" ]; then
            echo "no service container publishing 14330" >&2
            docker ps -a >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            if docker exec "$id" /opt/mssql-tools18/bin/sqlcmd \
                 -C -S localhost -U sa -P "Pbps!Ci12345" -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          # The container has crashed at startup twice on this job, and both
          # times the reason was only visible in its own log — which the raw
          # job output buries under teardown noise. Print it where the failure
          # is, so the next occurrence is diagnosable without a dig.
          echo "SQL Server never became ready" >&2
          echo "----- service container log -----" >&2
          docker logs "$id" >&2 2>&1 || true
          exit 1
      # One test compares this server with a second, Express one, and that pair
      # lives in `live-editions`: a second SQL Server starting beside this one
      # is the pressure the startup crashes in docs/PITFALLS.md warn about, and
      # it crashed this job the first time it was tried (#611). Skipped by
      # name here; unset, its variable makes the test fail rather than pass.
      - run: cargo test -p pbps-mssql --test live -- --ignored --skip a_real_express_target_is_an_edition_limitation
      - run: python3 scripts/live-transport.py mssql
      # Phase 3.1's onboarding path and the optional dev rehearsal both cross
      # the CLI/database boundary, so the dialect-only suite cannot exercise
      # them. Keep these ignored in ordinary jobs and run them here against the
      # same real engine.
      # Single-threaded: these share one SQL Server, and the deployment lock is
      # a single row in it. Two tests taking it concurrently make each other
      # fail, and the failure looks like a bug in the lock rather than in the
      # test schedule.
      - run: cargo test -p pbps-cli --test flow -- --ignored --test-threads=1

  # Two real instances of one build, as two editions under two server
  # collations: the two facts of the resolver's analysis-scope rule that no
  # database on one server can vary (#611).
  #
  # Its own job, and the engines are started by a step rather than as
  # services: services start together, and two SQL Servers starting at once on
  # one runner is the pressure the startup crashes in docs/PITFALLS.md warn
  # about — as service containers in `live` they crashed it on the second run.
  # Here the second starts only once the first answers, and a crash costs this
  # job alone rather than every SQL Server suite.
  live-editions:
    needs: quick
    runs-on: ubuntu-latest
    env:
      IMAGE: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
      PBPS_TEST_DB: "Server=localhost,14330;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
      PBPS_TEST_EXPRESS_DB: "Server=localhost,14331;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: start the two SQL Servers, one after the other
        run: |
          await() {
            for _ in $(seq 1 60); do
              if docker exec "$1" /opt/mssql-tools18/bin/sqlcmd \
                   -C -S localhost -U sa -P "Pbps!Ci12345" -Q "SELECT 1" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "$1 never became ready" >&2
            echo "----- container log -----" >&2
            docker logs "$1" >&2 2>&1 || true
            return 1
          }
          docker run -d --name pbps-ci-mssql -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=Pbps!Ci12345" -p 14330:1433 "$IMAGE" >/dev/null
          await pbps-ci-mssql
          docker run -d --name pbps-ci-mssql-express -e ACCEPT_EULA=Y -e MSSQL_PID=Express \
            -e MSSQL_COLLATION=Latin1_General_100_CS_AS \
            -e "MSSQL_SA_PASSWORD=Pbps!Ci12345" -p 14331:1433 "$IMAGE" >/dev/null
          await pbps-ci-mssql-express
      # A name filter that matches nothing passes with zero tests, so the run
      # is required to have run the one test this job exists for.
      - name: the edition test
        run: |
          set -o pipefail
          cargo test -p pbps-mssql --test live -- --ignored \
            a_real_express_target_is_an_edition_limitation | tee edition.log
          grep -q "test result: ok. 1 passed" edition.log


  # The PostgreSQL half of SPEC 11.5, and at this phase a small one: the crate
  # holds a connected boundary and two lexical rules, so those are what it
  # measures (issue #75). It found something no other job could — the seam
  # panicked on its first real connection because two rustls crypto providers
  # were compiled in — which is the argument for having it before there is a
  # dialect to test.
  #
  # Its own job rather than a step in `live`: that one already runs a SQL
  # Server, and a second engine on the same runner is the pressure the startup
  # crashes in docs/PITFALLS.md suggest is worth not adding.
  live-pg:
    needs: quick
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest, for the reason the SQL Server one is: PostgreSQL
        # 18.6 (Debian 18.6-1.pgdg13+2). Bump deliberately, and run
        # `scripts/live-tests-pg.sh` against the new digest before pushing it.
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54320:5432
        # This image has a health check hook, so no wait loop stands in for one.
        options: >-
          --health-cmd "pg_isready -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A second PostgreSQL, older than 17, because `MAINTAIN` arrived in 17:
      # "this engine refuses the word" and "this engine takes it" are two
      # different servers, and no single one can show both (ADR-0010 §6).
      # Measured on this digest: PostgreSQL 16.15, `server_version_num` 160015,
      # `GRANT MAINTAIN` is `unrecognized privilege type "maintain"`. Bump it
      # only to another release **below 17** — past that, the test asserting
      # the refusal would pass for no reason.
      #
      # A second engine on one runner is the pressure the startup crashes in
      # docs/PITFALLS.md warn about; a second *PostgreSQL* is the cheap version
      # of that, and it is the only way this rule can be measured at all.
      postgres-old:
        image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PBPS_TEST_PG_DB: "host=localhost port=54320 user=postgres password=Pbps!Ci12345 dbname=pbps_test sslmode=disable"
      PBPS_TEST_PG_OLD_DB: "host=localhost port=54321 user=postgres password=Pbps!Ci12345 dbname=pbps_test sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Thirty seconds of this is one test waiting out `CONNECT_TIMEOUT` on
      # purpose: a firewall that drops rather than refuses is a category of its
      # own, and what proves the wait is bounded is waiting it out.
      - run: cargo test -p pbps-pg --test live -- --ignored
      # Private capture internals have live snapshot/rendering regressions.
      - run: cargo test -p pbps-pg --lib -- --ignored --test-threads=1
      - run: python3 scripts/live-transport.py pg
      # The CLI's own PostgreSQL-dependent test, in the bin target rather than
      # in `tests/` because `deploy::run_probes` is private and what it asserts
      # is that the probes are answered under the settings the statements they
      # clear will run under (DECISIONS 415). `cargo test --workspace` in
      # `quick` builds it and does not run it: it is `#[ignore]`d.
      - run: cargo test -p pbps-cli --bin pbps -- --ignored --test-threads=1
      # The CLI end to end on this engine (issue #85): `bootstrap`, `verify`,
      # `plan --db`, `apply`, `state list`, `pull`, `doctor`, each through the
      # seam in `engine.rs`. Serial, because each test creates and drops a
      # database of its own.
      - run: cargo test -p pbps-cli --test flow_pg -- --ignored --test-threads=1
        env:
          PBPS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}

  # `plan --dev docker://<image>` starts a throwaway container of its own, and
  # nothing else reaches that code: every other `--dev` test passes a connection
  # string. It shipped broken for exactly that reason — the cleanup guard
  # removed the container it had just returned, so the feature had never worked
  # (docs/PITFALLS.md, "A guard built twice is a guard that fires early").
  #
  # Its own job rather than a step in `live`: that one already runs a SQL Server
  # as a service container, and a second engine on the same runner is the
  # pressure the startup crashes suggest is worth not adding.
  dev-rehearsal:
    needs: quick
    runs-on: ubuntu-latest
    env:
      PBPS_TEST_DEV_IMAGE: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: plan --dev docker://
        run: |
          # The name filter is asserted, not trusted: a rename would otherwise
          # leave this job green while running nothing, which is the shape
          # docs/PITFALLS.md calls "tests that pass for the wrong reason".
          out=$(cargo test -p pbps-cli --test flow -- \
                  --ignored --test-threads=1 a_dev_container_outlives 2>&1)
          echo "$out"
          echo "$out" | grep -qE '^test result: ok\. 1 passed' || {
            echo "expected exactly one test to run and pass" >&2
            exit 1
          }

  # Native admission needs one disposable Linux host per engine. Keep these
  # away from the shared live services: the full factory owns both a target
  # and scratch instance, and its root inspector reads their actual processes.
  resolver:
    needs: quick
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pg, mssql]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Preload explicitly trusted fixture images
        run: |
          docker pull postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          if [ "$FIXTURE_ENGINE" = mssql ]; then
            docker pull mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
          fi
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      - name: Docker ownership, containment and private channel
        run: python3 scripts/live-resolver.py "$FIXTURE_ENGINE"
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      - name: Native target aliases and unprotected proxy backend
        run: python3 scripts/live-resolver-target.py "$FIXTURE_ENGINE"
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      - name: Complete factory on the disposable native host
        run: |
          cargo test -p pbps-cli --lib --no-run --message-format=json > /tmp/pbps-resolver-artifacts.jsonl
          PBPS_FIXTURE_BINARY=$(python3 -c 'import json; rows = [json.loads(line) for line in open("/tmp/pbps-resolver-artifacts.jsonl")]; print(next(row["executable"] for row in rows if row.get("executable") and row.get("target", {}).get("name") == "pbps_cli"))')
          echo "PBPS_FIXTURE_BINARY=$PBPS_FIXTURE_BINARY" >> "$GITHUB_ENV"
          sudo python3 scripts/live-resolver-target.py "$FIXTURE_ENGINE" --native-host --test-binary "$PBPS_FIXTURE_BINARY"
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      - name: Verified launch privileges before engine initialization
        run: sudo python3 scripts/live-resolver-launch.py "$FIXTURE_ENGINE" --test-binary "$PBPS_FIXTURE_BINARY"
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      # A supplied server pbps did not provision. It runs a target and a
      # dedicated server at once, so it keeps the same disposable host.
      - name: Dedicated scratch server lifecycle and exclusivity
        run: sudo python3 scripts/live-resolver-server.py "$FIXTURE_ENGINE" --test-binary "$PBPS_FIXTURE_BINARY"
        env:
          FIXTURE_ENGINE: ${{ matrix.engine }}
      - name: Namespace procfs identity and task observation
        if: matrix.engine == 'pg'
        run: sudo python3 scripts/live-resolver-namespace.py --test-binary "$PBPS_FIXTURE_BINARY"
      - name: Socket observation limits and native service binding
        if: matrix.engine == 'pg'
        run: sudo python3 scripts/live-resolver-sockets.py --test-binary "$PBPS_FIXTURE_BINARY"

  # The MSRV is set by serde-saphyr (see docs/ADR-0001). It gets its own job so
  # that accidentally using newer syntax is caught here rather than by a user.
  msrv:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # The whole point of the run, as far as the merge box is concerned: one
  # check for the ruleset to require, so that adding or removing a job above is
  # a change to this file and not to a ruleset nobody re-reads. `name` is the
  # `ci-gate` context `ci-before-merge` already requires.
  #
  # `if: ${{ always() }}` is load-bearing, and it must be `always()` rather than
  # any narrower condition. One rule drives all of it: **a skipped job reports a
  # skipped check run, and GitHub counts a skipped required check as a passing
  # one** (DECISIONS 206; rust-analyzer's `conclusion` job and clap's `ci` job
  # carry the same warning). So any condition that can skip *this* job hands the
  # merge box a pass for a matrix that did not pass. A job that `needs` a failed
  # job is skipped by default, which is why some condition is needed at all; and
  # `!cancelled()` skips it whenever the run is cancelled, which is why that one
  # is not enough. `always()` is the only condition that never skips.
  #
  # This job did carry `!cancelled()` at first, so the hole is recorded rather
  # than merely avoided: cancelling a run skipped the gate and opened the merge
  # box. Its reason belonged to the commit-status version — a status is
  # addressed to a SHA, so a cancelled run writing `failure` late could
  # overwrite the run that superseded it. Check runs never overwrite one another
  # — each belongs to its own run, and branch protection reads the latest on the
  # head — so that race ended with the mechanism while the guard against it
  # stayed. `always()` costs the opposite error: a cancelled run reports a
  # failing gate, cleared by `gh run rerun <run-id>`. Wrongly shut is
  # recoverable; wrongly open is not.
  #
  # For the same reason `skipped` and `cancelled` are failures below and not
  # passes. Nothing here is meant to be skipped; if something ever is, the gate
  # should shut rather than open, and a `paths` filter added later cannot
  # quietly qualify a pull request that nothing ran on.
  gate:
    name: ci-gate
    needs: [quick, windows, live, live-editions, live-pg, dev-rehearsal, resolver, msrv]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Through the environment, not `${{ }}` inside `run:`: interpolation
      # would splice the value into the program text.
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # `jq -e` exits non-zero when the result is false, so the verdict is
          # the exit status and needs no test of its own.
          if jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            exit 0
          fi
          jq -r 'to_entries[] | select(.value.result != "success")
                 | "::error::\(.key): \(.value.result)"' <<<"$NEEDS"
          exit 1
