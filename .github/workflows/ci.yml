name: CI

# An ordinary workflow: every pull request, every merge group and a nightly
# run on `master`. It was not always.
# While the repository was private, the full matrix on every commit of a review
# round cost more minutes than the allowance carried, so CI was started by hand
# and reported itself as a *commit status* — a `workflow_dispatch` check suite
# belongs to no pull request, so its check runs were green in the Actions tab
# and invisible in the PR (DECISIONS 206). Standard runners bill nothing on a
# public repository, so the reason is gone, and with it the workaround: `gate`
# below is an ordinary job whose check run reaches the pull request the
# ordinary way (DECISIONS 501).
#
# `merge_group` fires nothing until a merge queue is required on `master`
# (issue #636). It is declared now so that enabling one is a change to the
# ruleset alone: a queue whose required checks do not run on the merge group
# never advances.
#
# `workflow_dispatch` is kept for running the matrix on a branch that has no
# pull request. It cannot retry a pull request's CI: a dispatched check suite
# belongs to no pull request, so its `ci-gate` never reaches the merge box —
# the failure DECISIONS 206 describes, reached by a different route. A pull
# request's run is retried with `gh run rerun <run-id>`, which keeps the
# association because it is the same run.
#
# A pull-request run waits for approval before it runs anything (DEC-1017.1).
# The `approve` job below names the `ci-approval` environment, whose required
# reviewer must approve the run ("Review deployments") before any job starts,
# so a push during a review round queues a run that costs nothing, and a newer
# push cancels it through the concurrency group. The run on the head that
# qualified in review is approved; the merge group, `master` and a dispatched
# run name no environment and start by themselves. The environment must exist
# with its reviewer set before this file names it: a workflow that names a
# missing environment creates it with no protection at all.
#
# The approved pull-request run is a reduced set; the merge group runs every
# job (DEC-1835.1). `live` and `live-pg` repeat the suites the local full gate
# already ran on that head, and `release-windows` is the long job left. They
# carry `if: ${{ github.event_name != 'pull_request' }}` and are named in the
# gate's PR_OMITTED. That cannot qualify an untested merge:
# the merge queue is required and cannot be bypassed, so every change reaches
# `master` through a merge group whose gate demands `success` from every job.
# The pull-request set stays a subset of the merge-group set, so no job can
# fail a pull request that the merge group would pass.
#
# `master` runs nightly, not on push (DEC-1836.1). Under the required merge
# queue a push to `master` is the merge group's own commit, so a push run
# re-tested a tree that had just passed. What it still did was refresh the
# `master` caches every run restores, and the nightly run keeps that: a
# scheduled run executes on the default branch. It also catches drift in
# runner images and pinned engines on days nothing merges.
#
# Do not add `paths` or `paths-ignore` here. `ci-gate` is a required check, and
# a required check that never reports leaves a pull request blocked with
# nothing that can clear it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  # 19:41 UTC: outside the working day, and apart from the dependency audit's
  # Monday 06:17.
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch:

# Named here so the grant is one line rather than the repository-wide default:
# no job writes anything, `gate` included — it reports by failing, not by
# calling the API.
permissions:
  contents: read
  pull-requests: read

# A label addition explicitly requests fresh PR-associated CI after a base
# change (DEC-1457.1). Title/body edits are excluded at the event trigger: a
# skipped, renamed gate still supersedes qualified checks in GitHub's merge
# box. Every admitted label runs the same approval route, so label
# filtering cannot publish a skipped required check or lose its previous name.
# Only PR runs cancel predecessors; master and merge groups need an answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every other job waits on this one, through `lint`. On a pull request it
  # is held by the `ci-approval` environment until approved; everywhere else
  # the expression yields no environment and it passes at once. A rejected
  # approval fails it, which skips everything after it and shuts `ci-gate`.
  approve:
    name: approval
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'ci-approval' || '' }}
    outputs:
      checkout_sha: ${{ steps.checkout.outputs.checkout_sha }}
    steps:
      # Older PR heads can lack new CI helpers; use the defining workflow tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Pin the validated CI tree (${{ github.workflow_sha }})
        id: checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_pr_checkout.py

  # The fan-in every other job waits on: the short checks, in one job for one
  # toolchain and one cache restore. What it is kept for is that nothing
  # expensive starts for a commit that does not even compile (DECISIONS 501),
  # and clippy over `--all-targets` answers that in a fraction of the time the
  # tests take. The tests are in `quick`, beside the engine jobs rather than in
  # front of them (DEC-1370.1).
  lint:
    name: lint (ubuntu-latest)
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/ci-event-policy-test.sh
      - run: python3 scripts/ci_pr_checkout_test.py
      - run: python3 scripts/live_test_runners_test.py
      - run: python3 scripts/check_live_fixture_test.py
      # Before the toolchain: it needs none, and a duplicate decision
      # identifier from two branches merges without a textual conflict, so this
      # is the only place it is caught (DEC-671.1).
      - run: python3 scripts/check_decisions_test.py
      - run: python3 scripts/check-decisions.py
      # A name or a plan text that is used raw must not reach a message a
      # person reads (#2084); the compiler cannot see that last step.
      - run: python3 scripts/check_raw_in_messages_test.py
      - run: python3 scripts/check-raw-in-messages.py
      # The checker `ci-gate` runs on its own `needs` (#637).
      - run: python3 scripts/check_gate_needs_test.py
      - run: python3 scripts/ci_gate_verdict_test.py
      - run: python3 scripts/ci_release_scope_test.py
      - run: python3 scripts/pr_size_test.py
      - run: python3 scripts/localdb_qualify_test.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: python3 scripts/live_transport_test.py
      - run: python3 scripts/release_qualification_test.py
      - run: python3 scripts/findings_to_github_test.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  quick:
    name: test (ubuntu-latest)
    needs: [approve, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Terminal integration tests must fail when their fixture is unavailable.
      - name: Required Linux PTY fixtures (util-linux and coreutils)
        run: |
          script --version
          timeout --version
      - run: cargo test --workspace --all-targets
        env:
          INSTA_UPDATE: "no"
          INSTA_FORCE_PASS: "0"
      - run: python3 scripts/ignored_test_inventory_test.py
      - run: python3 scripts/ignored_test_inventory.py
      # --all-targets excludes doctests. These compile-fail cases pin the
      # downstream opacity of source-bearing native capture inputs (#876).
      - run: cargo test -p pbps-pg --doc
      # And that a resolver plan is sealed only by its own recheck (#1516).
      # Concrete CLI lowering, saved admission and serde-forgery negatives.
      - run: cargo test -p pbps-cli --doc
      # And that no operation key holds a uid a caller made up, and no
      # operation or its id can be serialized into a saved plan (#1961).
      - run: cargo test -p pbps-model --doc
      # Intermediate settlements and external draft copies grant no SQL
      # emission authority (DEC-1959.5).
      - run: cargo test -p pbps-diff --doc
      # Engine dev-dependencies enable fixtures; also test the ordinary API.
      - run: cargo test -p pbps-diff --doc --no-default-features
      # Immutable lowering and SQL Server's private emitter are compiler gates.
      - run: cargo test -p pbps-dialect --doc
      - run: cargo test -p pbps-mssql --doc

  # Development happens on Linux, so Windows coverage rests entirely on this
  # job: line endings, path separators and terminal detection are the kinds of
  # platform difference that only show up here.
  windows:
    name: test (windows-latest)
    needs: [approve, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --workspace --all-targets
        env:
          INSTA_UPDATE: "no"
          INSTA_FORCE_PASS: "0"
      - run: python3 scripts/ignored_test_inventory_test.py
      - run: python3 scripts/ignored_test_inventory.py
      - name: Native fixture subnet selection
        shell: powershell
        run: ./scripts/release-windows-network-test.ps1

  # The SPEC 11.5 invariants against a real SQL Server (bootstrap == introspect,
  # apply(plan(A->B)) converges on B). Linux only: the service container needs a
  # Linux docker host.
  live:
    needs: [approve, lint]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Two suites, each with its own SQL Server (#1837): the dialect targets
    # and the single-threaded CLI flow ran one after the other on one host,
    # which made this the second-longest job in the merge group. Every
    # ignored case still runs in exactly one suite; the inventory in `quick`
    # refuses a split that drops one.
    strategy:
      fail-fast: false
      matrix:
        suite: [dialect, flow]
    services:
      mssql:
        # Pinned by digest: SQL Server 2025 RTM, 17.0.4075.5, image built
        # 2026-07-23. `2025-latest` is a floating tag, so the engine under test
        # could change between two runs of the same commit — which is the one
        # thing a suite that exists to answer "what does the engine actually do"
        # cannot afford. Bump deliberately, and run `scripts/live-tests.sh`
        # against the new digest before pushing the bump.
        #
        # This is **not** a fix for the startup crashes recorded in
        # docs/PITFALLS.md; their cause is unproven and looks resource-shaped
        # (errno 11 on a 2-CPU runner). What it buys is that the next one is
        # reproducible instead of unrepeatable.
        image: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Pbps!Ci12345"
        ports:
          - 14330:1433
    env:
      PBPS_TEST_DB: "Server=localhost,14330;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ matrix.suite }}
      # The service has no health check hook here; the loop stands in for one.
      #
      # Found by the published port, not by `ancestor=<image>`: that filter
      # repeated the image reference, so pinning it above would have left the
      # two spellings free to drift apart and this step looking for a container
      # that no longer matches.
      - name: wait for SQL Server
        run: |
          id=$(docker ps -q --filter publish=14330)
          if [ -z "$id" ]; then
            echo "no service container publishing 14330" >&2
            docker ps -a >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            if docker exec "$id" /opt/mssql-tools18/bin/sqlcmd \
                 -C -S localhost -U sa -P "Pbps!Ci12345" -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          # The container has crashed at startup twice on this job, and both
          # times the reason was only visible in its own log — which the raw
          # job output buries under teardown noise. Print it where the failure
          # is, so the next occurrence is diagnosable without a dig.
          echo "SQL Server never became ready" >&2
          echo "----- service container log -----" >&2
          docker logs "$id" >&2 2>&1 || true
          exit 1
      # Two tests need a second, Express server beside this one, and they live
      # in `live-editions`: a second SQL Server starting beside this one is
      # the pressure the startup crashes in docs/PITFALLS.md warn about, and
      # it crashed this job the first time it was tried (#611). Skipped by
      # name here; unset, their variable makes them fail rather than pass.
      - run: cargo test -p pbps-mssql --test live -- --ignored --skip a_real_express_target_is_an_edition_limitation --skip a_global_temporary_table_marks_one_instance_to_every_login_on_it --skip scratch2236 --skip deployer2267 --skip staged2268 --skip externals2269
        if: matrix.suite == 'dialect'
      # Driver error conversion is a separate test target, ignored by quick.
      - run: cargo test -p pbps-db --test live_mssql -- --ignored
        if: matrix.suite == 'dialect'
      # Phase 3.1's onboarding path and the optional dev rehearsal both cross
      # the CLI/database boundary, so the dialect-only suite cannot exercise
      # them. Keep these ignored in ordinary jobs and run them here against the
      # same real engine.
      # Single-threaded: these share one SQL Server, and the deployment lock is
      # a single row in it. Two tests taking it concurrently make each other
      # fail, and the failure looks like a bug in the lock rather than in the
      # test schedule.
      # Except the one that needs a second edition, which `live-editions` runs.
      # Docker cancellation belongs to the image-owning dev-rehearsal job.
      - run: cargo test -p pbps-cli --test flow -- --ignored --test-threads=1 --skip connected_plan_json_reports_unsupported_online_edition_as_a_finding --skip dev587::docker_signals_remove_the_rehearsal_container_and_its_volumes
        if: matrix.suite == 'flow'
      # A session killed mid-run (error 596, #669) leaves nothing in the job
      # log about why: the test sees only "the session is in the kill state".
      # The server's own errorlog is where a kill, a severe error or memory
      # pressure is recorded, so it is printed whenever a step above failed,
      # and the next occurrence names its cause instead of being re-run blind.
      - name: SQL Server errorlog after a failure
        if: ${{ failure() }}
        run: |
          id=$(docker ps -aq --filter publish=14330)
          if [ -n "$id" ]; then
            docker exec "$id" tail -n 300 /var/opt/mssql/log/errorlog >&2 || docker logs "$id" >&2 2>&1 || true
          fi

  # Scratch separation needs two matching SQL Servers on its own runner.
  resolver-mssql:
    needs: [approve, lint]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: the SQL Server resolver fixtures and live regressions
        run: |
          source scripts/resolver-mssql-fixtures.sh
          # The Express cases need the edition job's second server.
          cargo test --profile live-test -p pbps-mssql --test live -- --ignored --test-threads=1 scratch2236 \
            --skip an_express_supplied_reference_predicts_a_fresh_database_exactly \
            --skip an_express_database_closed_before_its_read_still_reads_as_open
          cargo test --profile live-test -p pbps-mssql --test live -- --ignored --test-threads=1 deployer2267
          cargo test --profile live-test -p pbps-mssql --test live -- --ignored --test-threads=1 staged2268
          cargo test --profile live-test -p pbps-mssql --test live -- --ignored --test-threads=1 externals2269
          cargo test --profile live-test -p pbps-cli --lib -- --ignored --test-threads=1 mssql_live_tests

  # LocalDB is a per-user Windows instance that accepts only a named pipe and
  # integrated authentication, so no Linux job can qualify it as the resolver's
  # other instance (#2271). The job installs the pinned installer, creates a
  # dedicated ordinary user and three private instances, and runs the cases
  # as that user (DEC-2271.2). It runs on pull requests too, so the Windows
  # route cannot be the one thing a pull request is never asked about; an
  # installer, discovery or instance failure, a case that did not run, a
  # timeout and a skip all fail it, and nothing here is `continue-on-error`.
  resolver-localdb:
    needs: [approve, lint]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/localdb_qualify.py

  # The SQL Server TLS fixture starts its own disposable SQL Server (3 GiB
  # limit). Run in `live`, it sat beside that job's service container: two SQL
  # Servers on one runner, the pressure the startup crashes in docs/PITFALLS.md
  # warn about. Here it has a runner to itself, with no services, so a crash
  # costs this job alone and cannot be mistaken for one of `live`'s (#627).
  live-transport-mssql:
    needs: [approve, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Built before the fixture runs: it points `SSL_CERT_FILE` at its own
      # disposable CA for every `cargo test` it starts, so a cargo that still
      # had to download a crate would fail to verify crates.io instead of
      # testing the hop. In `live` an earlier step had always built it.
      - run: cargo test -p pbps-db --test live_transport --no-run
      - run: python3 scripts/live-transport.py mssql
      # The fixture removes its container on success, failure and SIGTERM. A
      # cancelled job still loses the runner, so this checks the paths that
      # finish: a leftover `pbps-tls-*` container fails the job, and the
      # memory the runner has is printed beside the 3 GiB limit.
      - name: fixture resources after the run
        if: ${{ always() }}
        run: |
          free -m
          left=$(docker ps -aq --filter name=pbps-tls-)
          if [ -n "$left" ]; then
            echo "::error::the TLS fixture left containers behind" >&2
            docker ps -a --filter name=pbps-tls- >&2
            exit 1
          fi

  # Two real instances of one build, as two editions under two server
  # collations: the two facts of the resolver's compatibility rule that no
  # database on one server can vary (#611).
  #
  # Its own job, and the engines are started by a step rather than as
  # services: services start together, and two SQL Servers starting at once on
  # one runner is the pressure the startup crashes in docs/PITFALLS.md warn
  # about — as service containers in `live` they crashed it on the second run.
  # Here the second starts only once the first answers, and a crash costs this
  # job alone rather than every SQL Server suite.
  live-editions:
    needs: [approve, lint]
    runs-on: ubuntu-latest
    env:
      IMAGE: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
      PBPS_TEST_DB: "Server=localhost,14330;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
      PBPS_TEST_EXPRESS_DB: "Server=localhost,14331;User Id=sa;Password=Pbps!Ci12345;TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: start the two SQL Servers, one after the other
        run: |
          await() {
            # A login can succeed while MSSQL_COLLATION is still being applied.
            local collation=${2:-SQL_Latin1_General_CP1_CI_AS}
            for _ in $(seq 1 60); do
              if docker exec "$1" /opt/mssql-tools18/bin/sqlcmd \
                   -C -S localhost -U sa -P "Pbps!Ci12345" -b -Q "IF COALESCE(CONVERT(varchar(128), SERVERPROPERTY('Collation')), '') <> '$collation' THROW 50000, 'fixture collation is not ready', 1;" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "$1 never became ready" >&2
            echo "----- container log -----" >&2
            docker logs "$1" >&2 2>&1 || true
            return 1
          }
          docker run -d --name pbps-ci-mssql -e ACCEPT_EULA=Y \
            -e "MSSQL_SA_PASSWORD=Pbps!Ci12345" -p 14330:1433 "$IMAGE" >/dev/null
          await pbps-ci-mssql
          docker run -d --name pbps-ci-mssql-express -e ACCEPT_EULA=Y -e MSSQL_PID=Express \
            -e MSSQL_COLLATION=Latin1_General_100_CS_AS \
            -e "MSSQL_SA_PASSWORD=Pbps!Ci12345" -p 14331:1433 "$IMAGE" >/dev/null
          await pbps-ci-mssql-express Latin1_General_100_CS_AS
      # A name filter that matches nothing passes with zero tests, so the run
      # is required to have run the four tests this job exists for: the
      # edition comparison, the instance marker (#619) and Express's fresh
      # database options, predicted and read after AUTO_CLOSE (#2377).
      - name: the edition tests
        run: |
          set -o pipefail
          cargo test -p pbps-mssql --test live -- --ignored \
            a_real_express_target_is_an_edition_limitation \
            a_global_temporary_table_marks_one_instance_to_every_login_on_it \
            an_express_supplied_reference_predicts_a_fresh_database_exactly \
            an_express_database_closed_before_its_read_still_reads_as_open | tee edition.log
          grep -q "test result: ok. 4 passed" edition.log
      # And the CLI's answer to an online strategy Express cannot run (#574).
      - name: the connected online-edition refusal
        run: |
          set -o pipefail
          cargo test -p pbps-cli --test flow -- --ignored --exact \
            connected_plan_json_reports_unsupported_online_edition_as_a_finding | tee online.log
          grep -q "test result: ok. 1 passed" online.log


  # The PostgreSQL half of SPEC 11.5, and at this phase a small one: the crate
  # holds a connected boundary and two lexical rules, so those are what it
  # measures (issue #75). It found something no other job could — the seam
  # panicked on its first real connection because two rustls crypto providers
  # were compiled in — which is the argument for having it before there is a
  # dialect to test.
  #
  # Its own job rather than a step in `live`: that one already runs a SQL
  # Server, and a second engine on the same runner is the pressure the startup
  # crashes in docs/PITFALLS.md suggest is worth not adding.
  #
  # Four runners, each with its own pair of servers. Run in sequence the suites
  # took close to forty minutes, most of it in two that must stay serial
  # against one server, and nothing else in the run takes half that
  # (DEC-1370.1). Each variant runs its share exactly as the single job did;
  # `scripts/ignored_test_inventory.py` refuses a split that leaves an ignored
  # case in no variant, so a filter that drifts fails `quick` instead of
  # dropping tests.
  live-pg:
    needs: [approve, lint]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [dialect, capture, flow-0, flow-1, flow-2]
    services:
      postgres:
        # Pinned by digest, for the reason the SQL Server one is: PostgreSQL
        # 18.6 (Debian 18.6-1.pgdg13+2). Bump deliberately, and run
        # `scripts/live-tests-pg.sh` against the new digest before pushing it.
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54320:5432
        # TCP excludes the socket-only initialization server (#1471).
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A second PostgreSQL, older than 17, because `MAINTAIN` arrived in 17:
      # "this engine refuses the word" and "this engine takes it" are two
      # different servers, and no single one can show both (ADR-0010 §6).
      # Measured on this digest: PostgreSQL 16.15, `server_version_num` 160015,
      # `GRANT MAINTAIN` is `unrecognized privilege type "maintain"`. Bump it
      # only to another release **below 17** — past that, the test asserting
      # the refusal would pass for no reason.
      #
      # A second engine on one runner is the pressure the startup crashes in
      # docs/PITFALLS.md warn about; a second *PostgreSQL* is the cheap version
      # of that, and it is the only way this rule can be measured at all.
      postgres-old:
        image: postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # A second PostgreSQL 18 cluster: the resolver's scratch on another
      # cluster, the one placement where an account that may create roles and
      # databases is allowed (DEC-1672.1). Same digest as `postgres`, so the
      # compatibility rule compares equal builds.
      postgres-scratch:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PBPS_TEST_PG_DB: "host=localhost port=54320 user=postgres password=Pbps!Ci12345 dbname=pbps_test sslmode=disable"
      PBPS_TEST_PG_OLD_DB: "host=localhost port=54321 user=postgres password=Pbps!Ci12345 dbname=pbps_test sslmode=disable"
      PBPS_TEST_PG_SCRATCH_DB: "host=localhost port=54322 user=postgres password=Pbps!Ci12345 dbname=pbps_test sslmode=disable"
      # The images a Docker scratch starts from (#1674): the services' own
      # digests, which the runner pulled to start them, so the default
      # `pull: never` finds them.
      PBPS_TEST_PG_SCRATCH_IMAGE: "postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
      PBPS_TEST_PG_OLD_SCRATCH_IMAGE: "postgres@sha256:485935f94cc7165afa896978809c37b592dc07f0a37d2c8f645f12412d0212c8"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Flow shares build the same target and restore the existing flow-rest cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ startsWith(matrix.suite, 'flow-') && 'flow-rest' || matrix.suite }}
      # Thirty seconds of this is one test waiting out `CONNECT_TIMEOUT` on
      # purpose: a firewall that drops rather than refuses is a category of its
      # own, and what proves the wait is bounded is waiting it out.
      - run: cargo test -p pbps-pg --test live -- --ignored --skip commutation::pairs
        if: matrix.suite == 'dialect'
      - run: cargo test -p pbps-pg --test type_slots -- --ignored
        if: matrix.suite == 'dialect'
      # The commutation sample (#1965) rides with the capture half: `dialect`
      # is the longest PostgreSQL shard, and the sample must not lengthen it.
      - run: cargo test -p pbps-pg --test live -- --ignored commutation::pairs
        if: matrix.suite == 'capture'
      - run: cargo test -p pbps-db --test live_pg -- --ignored
        if: matrix.suite == 'dialect'
      - run: python3 scripts/live-transport.py pg
        if: matrix.suite == 'dialect'
      # The CLI's own PostgreSQL-dependent test, in the bin target rather than
      # in `tests/` because `deploy::run_probes` is private and what it asserts
      # is that the probes are answered under the settings the statements they
      # clear will run under (DECISIONS 415). `cargo test --workspace` in
      # `quick` builds it and does not run it: it is `#[ignore]`d.
      - run: cargo test -p pbps-cli --bin pbps -- --ignored --test-threads=1
        if: matrix.suite == 'dialect'
      # The resolver end to end (#1672): no root, the three servers above,
      # and the runner's own Docker for a Docker scratch (#1674). The filter
      # must not end in `:`, which YAML reads as a mapping and rejects the
      # whole file.
      - run: cargo test --profile live-test -p pbps-cli --lib -- --ignored --test-threads=1 resolver::server::scratch::live_tests
        if: matrix.suite == 'dialect'
      # Private capture internals have live snapshot/rendering regressions.
      # Split by module: the binding half rides with the short suites above.
      - run: cargo test --profile live-test -p pbps-pg --lib -- --ignored --test-threads=1 resolver::binding_tests
        if: matrix.suite == 'dialect'
      - run: cargo test --profile live-test -p pbps-pg --lib -- --ignored --test-threads=1 --skip resolver::binding_tests
        if: matrix.suite == 'capture'
      # The CLI end to end on this engine (issue #85): `bootstrap`, `verify`,
      # `plan --db`, `apply`, `state list`, `pull`, `doctor`, each through the
      # seam in `engine.rs`. Serial, because each test creates and drops a
      # database of its own.
      #
      # A fixed rule over the full list assigns new cases exactly once (DEC-2434.1).
      # pg_partman for `partitions: external` (#1533, DEC-1533.1), which
      # `pull` reads from pg_partman's own catalog: the cases install the
      # extension in a database of their own, and the package must be on both
      # servers. From the PGDG repository the image is built with, which keeps
      # only the current release; its catalog is what the cases read, and a
      # new one that changed it would fail them, which is the point.
      # Both at once, each `wait`ed on by its own pid so either failing
      # fails the step: the two downloads, not the work, are the cost.
      - name: Install pg_partman on both servers
        if: startsWith(matrix.suite, 'flow-')
        run: |
          set -euo pipefail
          pids=()
          for c in ${{ job.services.postgres.id }}:18 ${{ job.services.postgres-old.id }}:16; do
            docker exec "${c%%:*}" sh -c "apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends postgresql-${c##*:}-partman" &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - run: python3 scripts/live-shards.py ci 0/3 test -p pbps-cli --test flow_pg -- --ignored
        if: matrix.suite == 'flow-0'
        env:
          PBPS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          PBPS_TEST_PG_OLD_CONTAINER: ${{ job.services.postgres-old.id }}
      - run: python3 scripts/live-shards.py ci 1/3 test -p pbps-cli --test flow_pg -- --ignored
        if: matrix.suite == 'flow-1'
        env:
          PBPS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          PBPS_TEST_PG_OLD_CONTAINER: ${{ job.services.postgres-old.id }}
      - run: python3 scripts/live-shards.py ci 2/3 test -p pbps-cli --test flow_pg -- --ignored
        if: matrix.suite == 'flow-2'
        env:
          PBPS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          PBPS_TEST_PG_OLD_CONTAINER: ${{ job.services.postgres-old.id }}

  # Browser package downloads must not extend a serial flow_pg shard (DEC-2434.1).
  viewer:
    needs: [approve, lint]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest, for the reason the SQL Server one is: PostgreSQL
        # 18.6 (Debian 18.6-1.pgdg13+2). Bump deliberately, and run
        # `scripts/live-tests-pg.sh` against the new digest before pushing it.
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: "Pbps!Ci12345"
          POSTGRES_DB: pbps_test
        ports:
          - 54320:5432
        # TCP excludes the socket-only initialization server (#1471).
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pbps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the actual viewer executable
        run: cargo build --locked -p pbps-cli --bin pbps --target-dir "$RUNNER_TEMP/pbps-ui-build"
      - name: Shipped viewer in Chromium
        env:
          PBPS_TEST_UI_PG_URL: "postgresql://postgres:Pbps!Ci12345@127.0.0.1:54320/pbps_test?sslmode=disable"
        run: |
          PBPS_TEST_UI_BIN="$RUNNER_TEMP/pbps-ui-build/debug/pbps" \
            python3 scripts/ui-browser.py --install-deps

  # `plan --dev docker://<image>` starts a throwaway container of its own, and
  # nothing else reaches that code: every other `--dev` test passes a connection
  # string. It shipped broken for exactly that reason — the cleanup guard
  # removed the container it had just returned, so the feature had never worked
  # (docs/PITFALLS.md, "A guard built twice is a guard that fires early").
  #
  # Its own job rather than a step in `live`: that one already runs a SQL Server
  # as a service container, and a second engine on the same runner is the
  # pressure the startup crashes suggest is worth not adding.
  dev-rehearsal:
    needs: [approve, lint]
    runs-on: ubuntu-latest
    env:
      PBPS_TEST_DEV_IMAGE: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: plan --dev docker://
        run: |
          # Record the server, not just the client: Docker CLI can also use Podman.
          docker version
          # The name filter is asserted, not trusted: a rename would otherwise
          # leave this job green while running nothing, which is the shape
          # docs/PITFALLS.md calls "tests that pass for the wrong reason".
          out=$(cargo test -p pbps-cli --test flow -- \
                  --ignored --test-threads=1 a_dev_container_outlives \
                  dev587::docker_signals_remove_the_rehearsal_container_and_its_volumes 2>&1)
          echo "$out"
          echo "$out" | grep -qE '^test result: ok\. 2 passed' || {
            echo "expected both rehearsal tests to run and pass" >&2
            exit 1
          }

  release-linux:
    needs: [approve, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Keep release build outputs outside the checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/release-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl -p pbps-cli --bin pbps
      - name: Build a consumer with no source or development tools
        run: |
          mkdir "$RUNNER_TEMP/release-consumer"
          cp scripts/release-consumer.Dockerfile "$RUNNER_TEMP/release-consumer/Dockerfile"
          docker build -t pbps-release-consumer "$RUNNER_TEMP/release-consumer"
      - name: Exact musl artifact, both engines and TLS refusals
        run: python3 scripts/qualify-release.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/pbps" --consumer-image pbps-release-consumer --evidence "$RUNNER_TEMP/release-evidence.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-linux
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error

  release-windows:
    needs: [approve, lint]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static
    steps:
      - name: Keep release build outputs outside the checkout
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP/release-build" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Only a change to the qualification's own inputs can change its outcome,
      # so the rest of the job runs for those, and always on the nightly and
      # dispatched runs (DEC-1834.1). It never skips: `ci-gate` reads a skipped
      # job as a failure, so the job starts and every later step is conditioned
      # on this decision. An unreadable diff or unknown event runs in full.
      - name: Decide whether this change needs the Windows release qualification
        id: scope
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ needs.approve.outputs.checkout_sha }}
        run: |
          python scripts/ci_release_scope.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc -p pbps-cli --bin pbps
        if: steps.scope.outputs.run == 'true'
      - name: Start the runner Docker engine and wait for readiness
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Runner boot can leave Docker stopped (actions/runner-images#13729).
          $service = Get-Service -Name docker
          Write-Host "Docker service status: $($service.Status)"
          if ($service.Status -ne 'Running') {
            Start-Service -Name docker
          }
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            Write-Host "docker version attempt $attempt/12"
            docker version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          }
          throw 'Windows runner Docker engine fault (#1937; actions/runner-images#13729): Docker did not become ready after 12 attempts'
      - name: Build a clean native Windows consumer with only Git added
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'release-consumer'
          New-Item -ItemType Directory $context | Out-Null
          Copy-Item scripts/release-consumer-windows.Dockerfile (Join-Path $context 'Dockerfile')
          $git = Split-Path (Split-Path (Get-Command git.exe).Source)
          Copy-Item -Recurse $git (Join-Path $context 'git')
          docker build --isolation=process -t pbps-release-consumer $context
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Owned native PostgreSQL and SQL Server TLS fixtures
        if: steps.scope.outputs.run == 'true'
        shell: powershell
        run: ./scripts/release-windows-fixture.ps1 -Action Start -Root (Join-Path $env:RUNNER_TEMP 'release-fixture')
      - name: Exact MSVC artifact, both engines and TLS refusals
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          python scripts/qualify-release.py --binary "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/pbps.exe" --consumer-image pbps-release-consumer --windows-fixture "$env:RUNNER_TEMP/release-fixture/fixture.json" --evidence "$env:RUNNER_TEMP/release-evidence.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native fixture diagnostics after a failure
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        shell: powershell
        run: |
          if (Test-Path "$env:RUNNER_TEMP/release-fixture/owner.json") {
            ./scripts/release-windows-fixture.ps1 -Action Diagnose -Root (Join-Path $env:RUNNER_TEMP 'release-fixture')
          }
      - name: Remove only owned native fixtures
        if: ${{ always() && steps.scope.outputs.run == 'true' }}
        shell: powershell
        run: |
          if (Test-Path "$env:RUNNER_TEMP/release-fixture/owner.json") {
            ./scripts/release-windows-fixture.ps1 -Action Stop -Root (Join-Path $env:RUNNER_TEMP 'release-fixture')
          }
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.run == 'true'
        with:
          name: release-evidence-windows
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error

  # The MSRV is set by serde-saphyr (see docs/ADR-0001). It gets its own job so
  # that accidentally using newer syntax is caught here rather than by a user.
  msrv:
    needs: [approve, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --workspace

  # The whole point of the run, as far as the merge box is concerned: one
  # check for the ruleset to require, so that adding or removing a job above is
  # a change to this file and not to a ruleset nobody re-reads. `name` is the
  # `ci-gate` context `ci-before-merge` already requires.
  #
  # `if: ${{ always() }}` is load-bearing, and it must be `always()` rather than
  # any narrower condition. One rule drives all of it: **a skipped job reports a
  # skipped check run, and GitHub counts a skipped required check as a passing
  # one** (DECISIONS 206; rust-analyzer's `conclusion` job and clap's `ci` job
  # carry the same warning). So any condition that can skip *this* job hands the
  # merge box a pass for a matrix that did not pass. A job that `needs` a failed
  # job is skipped by default, which is why some condition is needed at all; and
  # `!cancelled()` skips it whenever the run is cancelled, which is why that one
  # is not enough. `always()` is the only condition that never skips.
  #
  # This job did carry `!cancelled()` at first, so the hole is recorded rather
  # than merely avoided: cancelling a run skipped the gate and opened the merge
  # box. Its reason belonged to the commit-status version — a status is
  # addressed to a SHA, so a cancelled run writing `failure` late could
  # overwrite the run that superseded it. Check runs never overwrite one another
  # — each belongs to its own run, and branch protection reads the latest on the
  # head — so that race ended with the mechanism while the guard against it
  # stayed. `always()` costs the opposite error: a cancelled run reports a
  # failing gate, cleared by `gh run rerun <run-id>`. Wrongly shut is
  # recoverable; wrongly open is not.
  #
  # Metadata edits deliberately create no required-check context: a skipped
  # job named `ci-gate` would count as passing and hide missing CI. The name
  # and admission condition below keep those runs out of qualification.
  # For the same reason `skipped` and `cancelled` are failures below and not
  # passes. The one exception is named: on a pull request, and only for the
  # jobs in PR_OMITTED, `skipped` is the expected result (DEC-1835.1).
  # Anything else skipped shuts the gate rather than opening it, so a `paths`
  # filter added later cannot quietly qualify a pull request nothing ran on.
  compatibility:
    name: compatibility (${{ matrix.cell }})
    needs: [approve, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: [mssql2022, mssql2025, mssql2025-express, pg16, pg18]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Qualify the pinned engine and core CLI contract
        env:
          CELL: ${{ matrix.cell }}
        run: scripts/compatibility-tests.sh "$CELL"

  gate:
    name: ci-gate
    needs: [approve, lint, quick, windows, live, resolver-mssql, resolver-localdb, live-transport-mssql, live-editions, live-pg, viewer, dev-rehearsal, release-linux, release-windows, msrv, compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # This job is the one required check and only as strong as its `needs`:
      # a job left out of that list could go red under a green gate. Checked
      # here rather than in a job the gate waits on, because deleting `needs`
      # would also drop that wait, and an empty `needs` passes the step below
      # (#637).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.approve.outputs.checkout_sha }}
      - run: python3 scripts/check_gate_needs.py
      # Through the environment, not `${{ }}` inside `run:`: interpolation
      # would splice the value into the program text.
      #
      # A pull request runs a reduced set (DEC-1835.1): the jobs in
      # PR_OMITTED carry `if: ${{ github.event_name != 'pull_request' }}`,
      # and only there, only for them, is `skipped` accepted. Every job must
      # succeed on every other event. The CI policy test keeps this list and
      # those conditions in step.
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          PR_OMITTED: live live-pg viewer resolver-mssql release-windows
        run: python3 scripts/ci_gate_verdict.py
